services:
  # Backend FastAPI service
  - type: web
    name: neural-analytics-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 main:app
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neural_analytics_db
          property: connectionString
      - key: COHERE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"

  # Frontend static site
  - type: static
    name: neural-analytics-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://neural-analytics-api.onrender.com

databases:
  - name: neural_analytics_db
    databaseName: neural_analytics
    plan: free
